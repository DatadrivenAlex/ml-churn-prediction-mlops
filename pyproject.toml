[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-mlops"
version = "0.1.0"
description = "Customer churn prediction pipeline with local experiment tracking, a versioned model registry, PSI drift checks, and a FastAPI scoring service."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexandru Cojocari" }]
keywords = ["churn", "machine-learning", "mlops", "scikit-learn", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy==2.5.4",
  "pandas==3.1.1",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.12"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "httpx>=0.27",
]

[project.scripts]
churn = "churn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=churn --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["churn"]

[tool.coverage.run]
source = ["src/churn"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
